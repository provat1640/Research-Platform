name: 🚀 Deploy Co-Auth to Azure App Service

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── PHP Setup ────────────────────────────────────────────────────────
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: >-
            mbstring, xml, ctype, iconv, intl, pdo_mysql, zip,
            bcmath, fileinfo, curl, tokenizer
          tools: composer:v2
          coverage: none

      # ─── Composer Cache ───────────────────────────────────────────────────
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # ─── Install Production PHP Dependencies ──────────────────────────────
      - name: Install Composer dependencies (production)
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      # ─── Ensure Storage Directories Exist ────────────────────────────────
      - name: Create required storage directories
        run: |
          mkdir -p storage/framework/{sessions,views,cache}
          mkdir -p bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      # ─── Node.js & Frontend Assets ───────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend assets (Vite production)
        run: npm run build
        env:
          VITE_APP_NAME: "Co-Auth"
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.AZURE_APP_NAME }}.azurewebsites.net
          VITE_REVERB_PORT: "443"
          VITE_REVERB_SCHEME: https

      # ─── Create a minimal .env for artisan optimize commands ─────────────
      - name: Prepare production .env
        run: |
          cp .env.example .env
          sed -i "s|APP_ENV=.*|APP_ENV=production|" .env
          sed -i "s|APP_DEBUG=.*|APP_DEBUG=false|" .env
          sed -i "s|APP_KEY=.*|APP_KEY=${{ secrets.APP_KEY }}|" .env

      # ─── Remove Development-Only Files Before Deploy ──────────────────────
      - name: Strip development artifacts
        run: |
          rm -rf \
            node_modules \
            tests \
            .github \
            docs \
            .cursor \
            .claude \
            *.md \
            CLAUDE.md \
            AGENTS.md \
            phpunit.xml \
            .phpunit.result.cache \
            .editorconfig \
            .npmrc

      # ─── Deploy to Azure App Service ──────────────────────────────────────
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
